name: Feature request
description: Suggest an improvement or new capability.
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Bestie do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Onboarding
        - Doctor
        - Terminal chat
        - Telegram
        - Memory
        - Provider / LLM
        - Speech / transcription
        - MCP / tools
        - Docs
        - Other
  - type: checkboxes
    id: safety
    attributes:
      label: Safety and privacy impact
      options:
        - label: This feature does not require new secrets.
        - label: This feature does not expose private chat, memory, logs, or local files.
        - label: This feature does not add external-write, public, destructive, or payment actions.
        - label: This feature may need extra security/privacy review.
